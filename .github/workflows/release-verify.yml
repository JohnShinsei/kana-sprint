name: Release verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - App.tsx
      - app.config.js
      - app.json
      - package-lock.json
      - package.json
      - requirements-ci.txt
      - tsconfig.json
      - assets/**
      - docs/**
      - languages/**
      - scripts/**
      - site/**
      - src/**
      - store.config.js
      - .github/workflows/release-verify.yml

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install screenshot dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Gameplay contract
        run: npm run gameplay-check

      - name: Release verification
        run: npm run release:verify
