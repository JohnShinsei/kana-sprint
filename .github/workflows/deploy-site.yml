name: Deploy public site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify static site package
        run: |
          test -f site/index.html
          test -f site/support/index.html
          test -f site/privacy/index.html
          test -f site/licenses/index.html
          test -f site/robots.txt
          test -f site/_headers
          test -f site/_redirects

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
