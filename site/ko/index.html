<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kana Sprint</title>
    <meta name="description" content="Kana Sprint는 60초 라운드로 가나, JLPT N5-N1 단어, 오리지널 애니풍 일본어 문장을 연습하는 게임입니다.">
    <style>
      :root {
        color-scheme: dark;
        --bg: #10151f;
        --panel: #172131;
        --ink: #fff7e8;
        --muted: #a7b0c4;
        --accent: #ffb23f;
        --green: #31c6a7;
        --line: #2e3a4e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }
      main {
        width: min(920px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 64px;
      }
      .mark {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border-radius: 16px;
        background: var(--accent);
        color: var(--bg);
        font-size: 38px;
        font-weight: 800;
      }
      nav { margin-bottom: 48px; }
      a { color: var(--accent); }
      h1 {
        margin: 0 0 18px;
        font-size: clamp(34px, 7vw, 58px);
        line-height: 1.05;
        letter-spacing: 0;
      }
      .brand h1 {
        margin: 0;
        font-size: clamp(42px, 8vw, 76px);
        line-height: 1;
      }
      h2 {
        margin: 38px 0 10px;
        font-size: 24px;
      }
      p, li {
        max-width: 760px;
        color: var(--muted);
        font-size: 18px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 34px;
      }
      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 18px;
        background: var(--panel);
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }
      .button.primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--bg);
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-top: 60px;
      }
      .fact, .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 20px;
      }
      .fact strong {
        display: block;
        margin-bottom: 6px;
        color: var(--green);
      }
      .table-scroll {
        width: 100%;
        overflow-x: auto;
        margin-top: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 12px 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--green);
        font-size: 14px;
        text-transform: uppercase;
      }
      td {
        color: var(--muted);
        font-size: 15px;
      }
      .locale-note {
        margin-top: 34px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>

      <div class="brand" aria-label="Kana Sprint">
        <div class="mark">あ</div>
        <div>
          <h1>Kana Sprint</h1>
          <p>일본어 스피드 학습 게임</p>
        </div>
      </div>
      <p>Kana Sprint는 60초 라운드로 가나, JLPT N5-N1 단어, 오리지널 애니풍 일본어 문장을 연습하는 게임입니다.</p>
      <div class="links">
        <a class="button primary" href="./support/">지원</a>
        <a class="button" href="./privacy/">개인정보 처리방침</a>
        <a class="button" href="./licenses/">오픈소스</a>
      </div>
      <section class="facts" aria-label="Product facts">
        <div class="fact"><strong>계정 불필요</strong>진행도와 설정은 기기 안에 저장됩니다.</div>
        <div class="fact"><strong>10개 UI 언어</strong>앱은 시스템 언어를 따르며 설정에서 바꿀 수 있습니다.</div>
        <div class="fact"><strong>오리지널 학습 콘텐츠</strong>애니풍 문장은 보호되는 대본, 캐릭터, 브랜드, 제목을 인용하지 않습니다.</div>
      </section>
      <p class="locale-note">한국어</p>

    </main>
  </body>
</html>
